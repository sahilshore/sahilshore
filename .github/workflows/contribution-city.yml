name: Refresh contribution city

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate contribution visualization
    runs-on: ubuntu-latest
    steps:
      - name: Generate 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit generated profile art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh contribution city"
          file_pattern: "profile-3d-contrib/**"
