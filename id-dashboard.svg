  <g transform="translate(380 28)"><text class="s" font-size="19" font-weight="700" fill="#F8FAFC">Engineering dashboard</text><text y="25" class="m" font-size="12" fill="#64748B">verified profile signals · current focus</text><g transform="translate(0 54)"><rect width="240" height="74" rx="14" fill="#111827" stroke="#293548"/><text x="18" y="25" class="m" font-size="11" fill="#64748B">PUBLIC REPOSITORIES</text><text x="18" y="58" class="s" font-size="30" font-weight="800" fill="#22D3EE">28</text><text x="74" y="57" class="m" font-size="12" fill="#94A3B8">projects shipped</text><rect x="260" width="240" height="74" rx="14" fill="#111827" stroke="#293548"/><text x="278" y="25" class="m" font-size="11" fill="#64748B">PRIMARY MODE</text><text x="278" y="58" class="s" font-size="24" font-weight="800" fill="#A78BFA">BUILD</text><text x="358" y="57" class="m" font-size="12" fill="#94A3B8">learn · iterate</text></g><g transform="translate(0 154)"><text class="m" font-size="11" fill="#64748B">PROJECT THEMES</text><text y="30" class="m" font-size="12" fill="#CBD5E1">Gen AI</text><rect x="92" y="19" width="330" height="12" rx="6" fill="#1E293B"/><rect x="92" y="19" width="290" height="12" rx="6" fill="#22D3EE" class="bar"/><text x="438" y="30" class="m" font-size="11" fill="#22D3EE">88%</text><text y="67" class="m" font-size="12" fill="#CBD5E1">RAG / agents</text><rect x="92" y="56" width="330" height="12" rx="6" fill="#1E293B"/><rect x="92" y="56" width="258" height="12" rx="6" fill="#A78BFA" class="bar"/><text x="438" y="67" class="m" font-size="11" fill="#A78BFA">78%</text><text y="104" class="m" font-size="12" fill="#CBD5E1">MLOps</text><rect x="92" y="93" width="330" height="12" rx="6" fill="#1E293B"/><rect x="92" y="93" width="225" height="12" rx="6" fill="#F472B6" class="bar"/><text x="438" y="104" class="m" font-size="11" fill="#F472B6">68%</text></g><rect y="278" width="500" height="28" rx="14" fill="#0B1220" stroke="#334155"/><circle cx="18" cy="292" r="5" fill="#34