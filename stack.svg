<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Sahil's technology stack</title><desc id="desc">Animated orbit of technology labels and grouped stack chips.</desc>
  <defs><linearGradient id="g"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="8"/></filter><style>.m{font-family:monospace}.s{font-family:Arial,sans-serif}.o{transform-origin:250px 160px;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.o2{animation-duration:20s;animation-direction:reverse}.chip{animation:chip 3s ease-in-out infinite}@keyframes chip{50%{stroke:#22D3EE;fill:#16243B}}</style></defs>
  <rect width="1200" height="330" rx="24" fill="#0D0E16"/><rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="url(#g)" stroke-width="2"/>
  <g transform="translate(0 0)"><circle cx="250" cy="160" r="80" fill="#22D3EE" opacity=".12" filter="url(#gl)"/><ellipse cx="250" cy="160" rx="180" ry="78" fill="none" stroke="#334155" stroke-dasharray="5 8"/><ellipse cx="250" cy="160" rx="130" ry="132" fill="none" stroke="#334155" stroke-dasharray="5 8" transform="rotate(-35 250 160)"/><circle cx="250" cy="160" r="48" fill="#111827" stroke="url(#g)" stroke-width="2"/><text x="220" y="154" class="s" font-size="13" fill="#CBD5E1">BUILD</text><text x="217" y="175" class="m" font-size="12" fill="#22D3EE">/ship</text><g class="o"><g transform="translate(414 150)"><circle r="23" fill="#111827" stroke="#22D3EE"/><text x="-18" y="5" class="m" font-size="11" fill="#E2E8F0">PY</text></g><g transform="translate(85 158)"><circle r="23" fill="#111827" stroke="#A78BFA"/><text x="-20" y="5" class="m" font-size="10" fill="#E2E8F0">RAG</text></g><g transform="translate(247 28)"><circle r="23" fill="#111827" stroke="#F472B6"/><text x="-20" y="5" class="m" font-size="10" fill="#E2E8F0">ML</text></g></g><g class="o o2"><g transform="translate(140 66)"><circle r="20" fill="#111827" stroke="#34D399"/><text x="-18" y="4" class="m" font-size="10" fill="#E2E8F0">API</text></g><g transform="translate(360 256)"><circle r="20" fill="#111827" stroke="#FBBF24"/><text x="-20" y="4" class="m" font-size="10" fill="#E2E8F0">OPS</text></g></g></g>
  <g transform="translate(510 35)"><text x="0" y="20" class="s" font-size="18" font-weight="700" fill="#F8FAFC">Stack map</text><text x="0" y="44" class="m" font-size="12" fill="#64748B">tools around the product lifecycle</text><g transform="translate(0 68)"><text class="m" font-size="11" fill="#22D3EE">LANGUAGES</text><g transform="translate(0 16)"><rect width="112" height="32" rx="16" fill="#111827" stroke="#334155" class="chip"/><text x="18" y="21" class="m" font-size="12" fill="#E2E8F0">Python</text><rect x="122" width="86" height="32" rx="16" fill="#111827" stroke="#334155" class="chip"/><text x="145" y="21" class="m" font-size="12" fill="#E2E8F0">SQL</text><rect x="218" width="86" height="32" rx="16" fill="#111827" stroke="#334155" class="chip"/><text x="240" y="21" class="m" font-size="12" fill="#E2E8F0">C++</text></g></g><g transform="translate(0 135)"><text class="m" font-size="11" fill="#A78BFA">GEN AI + RETRIEVAL</text><g transform="translate(0 16)"><rect width="112" height="32" rx="16" fill="#111827" stroke="#334155" class="chip"/><text x="17" y="21" class="m" font-size="12" fill="#E2E8F0">LangChain</text><rect x="122" width="102" height="32" rx="16" fill="#111827" stroke="#334155" class="chip"/><text x="141" y="21" class="m" font-size="12" fill="#E2E8F0">LlamaIndex</text><rect x="234" width="100" height="32" rx="16" fill="#111827" stroke="#334155" class="chip"/><text x="250" y="21" class="m" font-size="12" fill="#E2E8F0">OpenAI</text></g></g><g transform="translate(0 202)"><text class="m" font-size="11" fill="#F472B6">SHIP + OPERATE</text><g transform="translate(0 16)"><rect width="92" height="32" rx="16" fill="#111827" stroke="#334155" class="chip"/><text x="16" y="21" class="m" font-size="12" fill="#E2E8F0">Docker</text><rect x="102" width="92" height="32" rx="16" fill="#111827" stroke="#334155" class="chip"/><text x="116" y="21" class="m" font-size="12" fill="#E2E8F0">MLflow</text><rect x="204" width="72" height="32" rx="16" fill="#111827" stroke="#334155" class="chip"/><text x="220" y="21" class="m" font-size="12" fill="#E2E8F0">DVC</text><rect x="286" width="76" height="32" rx="16" fill="#111827" stroke="#334155" class="chip"/><text x="301" y="21" class="m" font-size="12" fill="#E2E8F0">Flask</text></g></g></g>
</svg>
